<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IA Vision - SENUM</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:700px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(10px);
    border-radius:25px;
    padding:30px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

h1{
    font-size:32px;
    margin-bottom:10px;
}

p{
    color:#cbd5e1;
    margin-bottom:25px;
}

button{
    background:#3b82f6;
    color:white;
    border:none;
    padding:14px 30px;
    border-radius:30px;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
    transition:0.3s;
}

button:hover{
    background:#2563eb;
    transform:scale(1.05);
}

#webcam-container{
    margin-top:30px;
}

canvas{
    border-radius:20px;
    border:4px solid #3b82f6;
    box-shadow:0 5px 20px rgba(59,130,246,0.4);
}

#label-container{
    margin-top:30px;
}

.prediction-card{
    background:#1e293b;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
    text-align:left;
}

.label{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
}

.progress{
    width:100%;
    height:12px;
    background:#334155;
    border-radius:10px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    background:#3b82f6;
    width:0%;
    transition:0.3s;
}

footer{
    margin-top:25px;
    color:#94a3b8;
    font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<h1>🤖 IA Vision - SENUM</h1>

<p>
Application d’intelligence artificielle utilisant
Teachable Machine et TensorFlow.js
</p>

<button onclick="init()">Démarrer la caméra</button>

<div id="webcam-container"></div>

<div id="label-container"></div>

<footer>
© 2026 Mohamed Djafar Abdalla Sall | Club SENUM
</footer>

</div>

<script>

const URL = "./my_model/";

let model, webcam, labelContainer, maxPredictions;

async function init() {

    const modelURL = URL + "model.json";
    const metadataURL = URL + "metadata.json";

    model = await tmImage.load(modelURL, metadataURL);

    maxPredictions = model.getTotalClasses();

    const flip = true;

    webcam = new tmImage.Webcam(300, 300, flip);

    await webcam.setup();

    await webcam.play();

    window.requestAnimationFrame(loop);

    document.getElementById("webcam-container").appendChild(webcam.canvas);

    labelContainer = document.getElementById("label-container");

    labelContainer.innerHTML = "";

    for(let i = 0; i < maxPredictions; i++){

        const div = document.createElement("div");

        div.classList.add("prediction-card");

        div.innerHTML = `
            <div class="label">
                <span>Classe</span>
                <span>0%</span>
            </div>

            <div class="progress">
                <div class="progress-bar"></div>
            </div>
        `;

        labelContainer.appendChild(div);
    }
}

async function loop(){

    webcam.update();

    await predict();

    window.requestAnimationFrame(loop);
}

async function predict(){

    const prediction = await model.predict(webcam.canvas);

    for(let i = 0; i < maxPredictions; i++){

        const probability = (prediction[i].probability * 100).toFixed(1);

        const card = labelContainer.childNodes[i];

        card.querySelector(".label").innerHTML = `
            <span>${prediction[i].className}</span>
            <span>${probability}%</span>
        `;

        card.querySelector(".progress-bar").style.width = probability + "%";
    }
}

</script>

</body>
</html>
